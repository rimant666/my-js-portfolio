<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevTool.js - Essential Utilities</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin-top: 10px; }
        button { background: #f7df1e; border: none; padding: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🛠️ DevTool.js</h1>
    
    <div class="card">
        <h3>JSON Prettifier</h3>
        <textarea id="jsonInput" placeholder="Paste messy JSON here..."></textarea>
        <button onclick="prettify()">Format JSON</button>
        <pre id="jsonOutput" style="background: #eee; padding: 10px; display: none;"></pre>
    </div>

    <div class="card">
        <h3>PX to REM Converter</h3>
        <input type="number" id="pxInput" placeholder="Pixels (e.g. 16)">
        <button onclick="convert()">Convert</button>
        <p id="remResult"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
